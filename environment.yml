# environment.yml for carpet-pfas (revision run)
#
# Reconstructed, evidence-based environment. It targets the versions found in
# the original "PFAS_Project_2" conda environment -- named as the PyCharm
# project SDK in the submitted repo's .idea/misc.xml -- as closely as
# conda-forge's current solver allows for python=3.9.19. It is NOT a
# byte-for-byte export of that original environment: PFAS_Project_2 was a
# shared, general-purpose env reused across multiple projects (it also had
# Jupyter, scikit-learn, PyQt5, statsmodels, plotnine, ... installed) and had
# been modified after the submitted run (conda-meta/history shows entries from
# 2025-10-03 and 2025-11-19). This file instead isolates only the packages this
# codebase's imports actually require, per an import scan across src/ and the
# 11 numbered scripts (numpy, pandas, scipy, matplotlib, geopandas, SALib).
#
# BLAS provider -- pinned explicitly, not left to the solver:
#   The original env uses MKL as its BLAS/LAPACK provider (libblas/libcblas/
#   liblapack build "23_win64_mkl", mkl=2024.1.0). Letting conda-forge's solver
#   pick freely resolved a much newer mkl=2025.3.1 (build "6_..._mkl") here,
#   and that specific pairing with numpy=2.0.2 crashed the interpreter (a hard,
#   silent process abort with no Python traceback) on any real BLAS/LAPACK
#   call, e.g. a plain `a @ a` matrix multiply -- reproduced and confirmed
#   before applying this pin. Explicitly pinning mkl=2024.1.0 (resolved here to
#   build "24_win64_mkl" for libblas/libcblas/liblapack, one build newer than
#   the original's "23_win64_mkl" but the same MKL version) fixed it; re-tested
#   after the pin and it now runs numpy matmul, scipy.stats.lognorm, and
#   scipy.optimize.curve_fit without error. Do not remove this pin.
#
# Two known deviations from the original PFAS_Project_2 versions remain, both
# in packages that geopandas depends on but that the code never imports
# directly:
#   - shapely  2.0.6 -> 2.0.7   (conda-forge's current geopandas=1.0.1 build
#                                 for python=3.9 pulls this patch release)
#   - gdal 3.9.2 (python package with bindings)
#         -> libgdal-core 3.9.3 (C library only; pyogrio ships its own
#            compiled GDAL bindings and does not need the separate `gdal`
#            python package)
# Neither shapely nor gdal is imported directly anywhere in this codebase.
#
# SALib has no conda-forge build compatible with python=3.9 (conda-forge's
# salib=1.5.2 requires python>=3.10), so it is installed via pip below --
# matching how it was also installed in the original PFAS_Project_2 env
# (recorded there as pip-installed: "salib 1.5.2 pypi_0 pypi").
#
# Reproduce with:
#   conda env create -f environment.yml
name: carpet-pfas-rev
